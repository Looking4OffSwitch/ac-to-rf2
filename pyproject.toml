[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ac-to-rf2"
version = "0.1.0"
description = "Convert Assetto Corsa tracks to rFactor 2 Developer Mode locations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "psutil>=6,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
ac2rf2 = "ac_to_rf2.build_track:main"
ac2rf2-test = "ac_to_rf2.drive_track:main"
ac2rf2-tools = "ac_to_rf2.setup_tools:main"
ac2rf2-check = "ac_to_rf2.check_setup:main"
ac2rf2-verify = "ac_to_rf2.verify_install:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ac_to_rf2*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
